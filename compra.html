<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compra de entradas para el festival Sonidos de la Ciudad.">
  <title>Compra de Entradas - Sonidos de la Ciudad</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS Global -->
  <link rel="stylesheet" href="css/style.css">

  <!-- CSS Componentes -->
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">

  <!-- CSS Página -->
  <link rel="stylesheet" href="css/compra.css">
</head>
<body>
  <!-- Efecto de grano (textura sutil) -->
  <div class="grain-overlay"></div>

  <!-- Navbar inyectado por JS -->
  <div id="navbar-container"></div>

 <main>
    <h1>Compra de Entradas</h1>
    
    <section class="purchase-form" style="max-width: 500px; margin: 0 auto; padding: 20px;">
      <h2>Formulario de Compra</h2>
      
      <form id="form-reserva-pago" onsubmit="return false;">
        
        <!-- PASO 1: SELECCIÓN DE SHOW -->
        <div style="background: #fff8f2; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e9dfd6;">
          <h3 style="margin-top: 0; color: var(--color-terracotta);">1. Selecciona tu Espectáculo</h3>
          
          <div class="form-group" style="margin-bottom: 15px;">
            <label for="evento-select" style="display: block; margin-bottom: 5px; font-weight: bold;">Espectáculo:</label>
            <select id="evento-select" style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px;">
              <option value="">-- Elige un show del listado --</option>
            </select>
          </div>

          <!-- Avisos dinámicos de Fecha y Lugar (No son inputs) -->
          <div id="info-evento-contenedor" style="display: none; background: #fff; padding: 12px; border-left: 4px solid var(--color-terracotta); border-radius: 4px; margin-top: 15px;">
            <p style="margin: 0 0 5px 0;"><strong>📅 Fecha:</strong> <span id="aviso-fecha"></span></p>
            <p style="margin: 0;"><strong>📍 Lugar:</strong> <span id="aviso-lugar"></span></p>
          </div>
        </div>

        <!-- PASO 2: DATOS DE PAGO (Se muestra solo cuando se elige un show) -->
        <div id="seccion-pago" style="display: none; background: #fff8f2; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e9dfd6;">
          <h3 style="margin-top: 0; color: var(--color-terracotta);">2. Datos de Pago</h3>
          
          <!-- Datos del Titular -->
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="pago-nombre" style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre del Titular (como figura en la tarjeta):</label>
            <input type="text" id="pago-nombre" placeholder="Juan Pérez" required style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          </div>

          <div class="form-group" style="margin-bottom: 12px;">
            <label for="pago-dni" style="display: block; margin-bottom: 5px; font-weight: bold;">DNI del Titular:</label>
            <input type="text" id="pago-dni" placeholder="Ej: 40123456" required style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          </div>

          <!-- Número de Tarjeta y Franquicia -->
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="tarjeta-numero" style="display: block; margin-bottom: 5px; font-weight: bold;">Número de Tarjeta:</label>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="text" id="tarjeta-numero" placeholder="4... o 5..." required style="padding: 10px; flex-grow: 1; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
              <span id="tarjeta-logo" style="font-weight: bold; padding: 10px; background: #eee; border-radius: 4px; min-width: 90px; text-align: center;">💳</span>
            </div>
          </div>

          <!-- Vencimiento y CCV -->
          <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
              <label for="tarjeta-vence" style="display: block; margin-bottom: 5px; font-weight: bold;">Vencimiento:</label>
              <input type="text" id="tarjeta-vence" placeholder="MM/AA" required style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
              <label for="tarjeta-ccv" style="display: block; margin-bottom: 5px; font-weight: bold;">CCV:</label>
              <input type="password" id="tarjeta-ccv" placeholder="123" maxlength="4" required style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
          </div>

          <button type="submit" id="btn-confirmar" style="padding: 12px 20px; background: var(--color-terracotta); color: white; border: none; border-radius: 4px; font-weight: 600; width: 100%; cursor: pointer;">Confirmar Reserva y Pago</button>
        </div>

      </form>
    </section>
  </main>

  <!-- Footer inyectado por JS -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
